services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      # Combined KRaft node: broker + controller (no ZooKeeper)
      KAFKA_PROCESS_ROLES: broker,controller
      # 0.0.0.0 so the host app can reach the mapped 9092 port
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Combined node talks to itself; do not use the container hostname here
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single-node cluster cannot replicate to 3 brokers (Kafka default)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk # keep stable so KRaft storage stays formatted
